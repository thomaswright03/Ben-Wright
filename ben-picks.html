<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ben's Picks · Ben Wright</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="/">Ben <span>Wright</span></a>
    <ul><li><a href="/">Back to profile</a></li></ul>
  </div>
</nav>


<main class="tool-view">
  <div class="wrap">
    <header class="page-head">
      <span class="eyebrow">For Ben</span>
      <h2>Ben's picks</h2>
      <p class="lede">Go through the schools and mark each one. We'll send the recruiting email to every school marked <strong>Send</strong> and leave out the ones marked <strong>Skip</strong>.</p>
    </header>

    <form class="gate" id="gate" autocomplete="off">
      <label for="pw">Password</label>
      <input type="password" id="pw" required>
      <p class="err" id="pw-err" hidden>That password isn't right. Check with Thomas.</p>
      <button class="btn primary" type="submit">Log in</button>
    </form>

    <div id="panel" hidden>
      <div class="pick-summary" id="summary"></div>
      <div class="filters">
        <input type="search" id="search" placeholder="Search schools, conferences, states" aria-label="Search schools">
        <div class="chips" id="div-chips" role="group" aria-label="Division"></div>
        <div class="chips" id="pick-chips" role="group" aria-label="Status"></div>
      </div>
      <p class="status" id="status"></p>
      <ul class="school-list" id="list"></ul>
    </div>
  </div>
</main>

<script src="/ben-picks.js"></script>
</body>
</html>
